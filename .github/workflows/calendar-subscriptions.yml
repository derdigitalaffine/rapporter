name: calendar-subscriptions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  calendar-subscriptions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: famuhle
          POSTGRES_USER: famuhle
          POSTGRES_PASSWORD: calendar-test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U famuhle" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: famuhle
      POSTGRES_USER: famuhle
      POSTGRES_PASSWORD: calendar-test
      DJANGO_SECRET_KEY: calendar-ci-only
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py makemigrations --check --dry-run && python manage.py migrate && python manage.py check
      - working-directory: backend
        run: python manage.py test family.test_calendar_subscriptions family.test_calendar_subscription_dav_expand family.test_calendar_caldav_participants family.test_calendar_subscription_detail_update family.test_calendar_subscription_member_scope family.test_calendar_recurrence family.test_caldav_sync family.test_caldav_sync_security family.test_caldav_selection_reset family.test_caldav_recurrence_scope auth_abuse.tests telemetry.tests
  calendar-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for config in Caddyfile Caddyfile.proxy Caddyfile.selfsigned; do
            docker run --rm -v "$PWD/$config:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null
          done
      - run: |
          docker run -d --name calendar-proxy -p 8080:80 -v "$PWD/Caddyfile.proxy:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          for attempt in $(seq 1 15); do
            if curl -s -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://localhost:8080/calendar-feed/ci-secret-must-be-redacted/family.ics
          docker logs calendar-proxy > calendar-proxy.log 2>&1
          if grep -F 'ci-secret-must-be-redacted' calendar-proxy.log; then exit 1; fi
          grep -F '/calendar-feed/[redacted]' calendar-proxy.log
