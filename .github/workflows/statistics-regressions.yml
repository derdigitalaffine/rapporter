name: statistics-regressions
on:
  pull_request:
    paths: ['backend/family_statistics/**', 'backend/family/**', 'backend/entitlements/**', 'backend/config/**', '.github/workflows/statistics-regressions.yml']
  push:
    branches: [main]
    paths: ['backend/family_statistics/**', 'backend/family/**', 'backend/entitlements/**', 'backend/config/**', '.github/workflows/statistics-regressions.yml']
permissions:
  contents: read
concurrency:
  group: statistics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  statistics-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: famuhle
          POSTGRES_USER: famuhle
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U famuhle" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: famuhle
      POSTGRES_USER: famuhle
      POSTGRES_PASSWORD: test-password
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - working-directory: backend
        run: python manage.py migrate && python manage.py check
      - working-directory: backend
        run: python manage.py test family_statistics family.test_unified_actions family.test_predictions entitlements
