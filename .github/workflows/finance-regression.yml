name: finance-regression

on:
  pull_request:
    paths:
      - 'backend/expenses/**'
      - 'backend/documents/**'
      - 'backend/entitlements/**'
      - 'backend/requirements.txt'
      - 'backend/family/private_images.py'
      - 'backend/family/profile_views.py'
      - 'frontend/src/*Expense*'
      - 'frontend/src/expenses*'
      - 'frontend/e2e/expenses*'
      - 'frontend/e2e/travel-expenses.spec.js'
      - '.github/workflows/finance-regression.yml'
  push:
    branches: [main]
    paths:
      - 'backend/expenses/**'
      - 'backend/documents/**'
      - 'backend/entitlements/**'
      - 'backend/requirements.txt'
      - 'backend/family/private_images.py'
      - 'backend/family/profile_views.py'
      - 'frontend/src/*Expense*'
      - 'frontend/src/expenses*'
      - 'frontend/e2e/expenses*'
      - 'frontend/e2e/travel-expenses.spec.js'
      - '.github/workflows/finance-regression.yml'

permissions:
  contents: read

concurrency:
  group: finance-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finance-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_DB: famuhle
          POSTGRES_USER: famuhle
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U famuhle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: famuhle
      POSTGRES_USER: famuhle
      POSTGRES_PASSWORD: test-password
      DJANGO_SECRET_KEY: finance-regression-only-secret-32-characters
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - working-directory: backend
        run: python manage.py migrate --noinput && python manage.py check
      - working-directory: backend
        run: python manage.py test expenses documents.test_smartphone_images entitlements

  finance-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium, desktop-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test e2e/expenses.spec.js e2e/expenses-actions.spec.js e2e/expenses-budget.spec.js e2e/travel-expenses.spec.js --project=${{ matrix.project }} --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-validation-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/error-context.md
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
