name: passkey-migrations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: passkey-migrations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-drift:
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_DB: famuhle
          POSTGRES_USER: famuhle
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U famuhle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: famuhle
      POSTGRES_USER: famuhle
      POSTGRES_PASSWORD: test-password
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py makemigrations auth_passkeys --check --dry-run
      - working-directory: backend
        run: python manage.py migrate && python manage.py check
