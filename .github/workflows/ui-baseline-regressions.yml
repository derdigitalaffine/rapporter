name: ui-baseline-regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ui-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: ui-baseline / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium, desktop-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: >-
          npm run e2e -- --project=${{ matrix.project }}
          e2e/messenger.spec.js e2e/messenger-family-nav-hotfix.spec.js
          e2e/messenger-mobile-fullwidth.spec.js e2e/family-messages.spec.js
          e2e/create-flow-registry.spec.js e2e/mobile-layout.spec.js
          e2e/navigation.spec.js
      - working-directory: frontend
        run: >-
          npm run e2e -- --project=${{ matrix.project }}
          e2e/i18n.spec.js e2e/familyos-brand.spec.js e2e/entitlements.spec.js
      - working-directory: frontend
        run: npm run e2e -- --project=${{ matrix.project }} e2e/core.spec.js --grep 'email login, Today and DE/EN smoke'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-baseline-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
