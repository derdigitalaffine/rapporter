name: Messenger quality
on:
  pull_request:
    paths:
      - 'backend/messenger/**'
      - 'frontend/src/Messenger*'
      - 'frontend/src/messenger*'
      - 'frontend/src/SymbolPicker*'
      - 'frontend/src/symbol-picker*'
      - 'frontend/src/ActionOptionsEditor.jsx'
      - 'frontend/src/ListEditor.jsx'
      - 'frontend/src/RoutineEditor.jsx'
      - 'frontend/stories/Messenger.stories.jsx'
      - 'frontend/e2e/messenger.spec.js'
      - '.github/workflows/messenger-quality.yml'
permissions:
  contents: read
concurrency:
  group: messenger-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build && npm run ui:boundaries && npm run bundle:check
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e -- messenger.spec.js
        working-directory: frontend
      - run: npm run build-storybook && npm run test:workbench -- --grep familyos-messenger
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messenger-browser-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
            frontend/workbench-results
            frontend/workbench-report
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_DB: famuhle
          POSTGRES_USER: famuhle
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U famuhle"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: famuhle
      POSTGRES_USER: famuhle
      POSTGRES_PASSWORD: test-password
      DJANGO_SECRET_KEY: ci-only-messenger-location-test-secret
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python manage.py makemigrations --check --dry-run && python manage.py test messenger
        working-directory: backend
