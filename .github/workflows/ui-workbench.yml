name: ui-workbench
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ui-workbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run ui:boundaries && node --test tests/ui-boundaries.test.mjs
      - run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stories
      - run: npm run test:workbench
      - run: npm run e2e -- e2e/interaction-primitives.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-workbench-${{ github.run_attempt }}
          path: |
            frontend/workbench-report
            frontend/workbench-results
            frontend/storybook-static/index.json
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
