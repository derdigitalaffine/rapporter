name: offline-client
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run test:offline && npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test e2e/local-sync-store.spec.js e2e/offline-sync-engine.spec.js
