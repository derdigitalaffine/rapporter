name: refresh-approved-visual-baselines

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/93-familyos-designsystem-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Regenerate approved visual baselines in CI environment
        working-directory: frontend
        run: |
          npx playwright test e2e/visual-regression.spec.js --project=mobile-chromium --update-snapshots
          npx playwright test e2e/visual-regression.spec.js --project=desktop-chromium --update-snapshots
      - name: Commit changed baselines only
        run: |
          if git diff --quiet -- frontend/e2e/visual-regression.spec.js-snapshots; then
            echo 'No visual baseline changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/e2e/visual-regression.spec.js-snapshots
          git commit -m 'test: refresh approved #93 visual baselines'
          git push origin HEAD:${{ github.head_ref }}
