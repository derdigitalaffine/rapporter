name: coordination-dashboard

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: coordination-dashboard
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Update coordination dashboard in issue 223
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const controlIssue = 223;
            const dashboardMarker = '<!-- coordination-dashboard:v1 -->';
            const claimMarker = '<!-- coordination:claim:v1 -->';
            const researchMarker = '<!-- external-research:v1 -->';

            // Public issue/PR metadata is untrusted input. Keep the privileged
            // #223 dashboard free from mentions and Markdown injection.
            const safeText = (value) => String(value ?? '')
              .replace(/[\r\n]+/g, ' ')
              .replace(/@/g, '@\u200b')
              .replace(/([\\`*_{}\[\]()<>#+.!|])/g, '\\$1');
            const safeCode = (value) => String(value ?? '')
              .replace(/[\r\n]+/g, ' ')
              .replace(/@/g, '@\u200b')
              .replace(/`/g, 'ˋ');

            const allIssueLike = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const issues = allIssueLike.filter((item) => !item.pull_request);
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const labelsOf = (issue) => (issue.labels || [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean)
              .map((label) => label.toLowerCase());

            const issueReferences = (body) => {
              const linked = new Set();
              const closing = new Set();
              const text = body || '';
              const closingPattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              const linkedPattern = /(?:ref(?:s|erences?)?|part\s+of)\s+#(\d+)/gi;
              for (const match of text.matchAll(closingPattern)) {
                const issueNumber = Number(match[1]);
                closing.add(issueNumber);
                linked.add(issueNumber);
              }
              for (const match of text.matchAll(linkedPattern)) {
                linked.add(Number(match[1]));
              }
              return { linked, closing };
            };

            const coordinationKeys = (body) => {
              const line = (body || '').split('\n')
                .find((value) => /^-\s*Coordination keys\s*:/i.test(value.trim()));
              if (!line) return [];
              const raw = line.replace(/^-\s*Coordination keys\s*:/i, '');
              return [...new Set(raw.split(',')
                .map((key) => key.trim().replace(/^`|`$/g, ''))
                .filter((key) => /^[a-z0-9_-]+:[a-z0-9_./:-]+$/i.test(key))
                .map((key) => key.toLowerCase()))];
            };

            const commentCache = new Map();
            const commentsFor = async (issueNumber) => {
              if (!commentCache.has(issueNumber)) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100,
                });
                commentCache.set(issueNumber, comments);
              }
              return commentCache.get(issueNumber);
            };

            const prData = [];
            for (const pr of pulls) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const refs = issueReferences(pr.body);
              prData.push({
                number: pr.number,
                title: pr.title,
                url: pr.html_url,
                updatedAt: pr.updated_at,
                linkedRefs: refs.linked,
                closingRefs: refs.closing,
                files: new Set(files.map((file) => file.filename)),
              });
            }

            const activeIssues = issues.filter((issue) => labelsOf(issue).includes('in progress'));
            const activeRows = [];
            const staleClaims = [];
            const claimsWithoutPr = [];
            const now = Date.now();
            const staleAfterMs = 72 * 60 * 60 * 1000;

            for (const issue of activeIssues) {
              const comments = await commentsFor(issue.number);
              const claimComments = comments.filter((comment) => (comment.body || '').includes(claimMarker));
              const latestClaim = claimComments.at(-1);
              const keys = latestClaim ? coordinationKeys(latestClaim.body) : [];
              const linkedPrs = prData.filter((pr) => pr.linkedRefs.has(issue.number));
              const latestVisibleActivity = Math.max(
                Date.parse(issue.updated_at || 0),
                ...linkedPrs.map((pr) => Date.parse(pr.updatedAt || 0)),
              );
              activeRows.push({ issue, hasClaim: Boolean(latestClaim), keys, linkedPrs });
              if (linkedPrs.length === 0) claimsWithoutPr.push(issue);
              if (now - latestVisibleActivity > staleAfterMs) staleClaims.push(issue);
            }

            const keyOwners = new Map();
            for (const row of activeRows) {
              for (const key of row.keys) {
                if (!keyOwners.has(key)) keyOwners.set(key, []);
                keyOwners.get(key).push(row.issue);
              }
            }
            const semanticCollisions = [...keyOwners.entries()]
              .filter(([, owners]) => owners.length > 1)
              .map(([key, owners]) => ({ key, owners }));

            const issueToClosingPrs = new Map();
            for (const pr of prData) {
              for (const issueNumber of pr.closingRefs) {
                if (!issueToClosingPrs.has(issueNumber)) issueToClosingPrs.set(issueNumber, []);
                issueToClosingPrs.get(issueNumber).push(pr);
              }
            }
            const sameIssueCollisions = [...issueToClosingPrs.entries()]
              .filter(([, list]) => list.length > 1)
              .map(([issueNumber, list]) => ({ issueNumber, list }));

            const fileOverlaps = [];
            for (let i = 0; i < prData.length; i += 1) {
              for (let j = i + 1; j < prData.length; j += 1) {
                const left = prData[i];
                const right = prData[j];
                const shared = [...left.files].filter((file) => right.files.has(file));
                if (shared.length > 0) {
                  fileOverlaps.push({ left, right, shared });
                }
              }
            }

            const internalAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const externalFeatureCandidates = issues.filter((issue) => {
              if (internalAssociations.has(issue.author_association || 'NONE')) return false;
              const labels = labelsOf(issue);
              return /^\[feature\]/i.test(issue.title || '')
                || labels.includes('enhancement')
                || labels.includes('feature')
                || labels.includes('feature request');
            });

            const missingResearch = [];
            for (const issue of externalFeatureCandidates) {
              const comments = await commentsFor(issue.number);
              if (!comments.some((comment) => (comment.body || '').includes(researchMarker))) {
                missingResearch.push(issue);
              }
            }

            const lines = [
              dashboardMarker,
              '## 🤝 Multi-Agent Coordination Dashboard',
              '',
              `Automatisch aktualisiert: ${new Date().toISOString()} · Steuerissue: #223 · Protokoll: \`AGENTS.md\``,
              '',
              '> Dieses Dashboard ist das gemeinsame Lagebild für Menschen und Agenten. Warnungen bedeuten: abstimmen, nicht blind stoppen.',
              '',
              '### Aktive Arbeit (`in progress`)',
            ];

            if (activeRows.length === 0) {
              lines.push('- Keine offenen Issues mit `in progress`.');
            } else {
              for (const row of activeRows.slice(0, 50)) {
                const prs = row.linkedPrs.length
                  ? row.linkedPrs.map((pr) => `#${pr.number}`).join(', ')
                  : 'noch kein referenzierender offener PR';
                const keys = row.keys.length ? row.keys.map((key) => `\`${safeCode(key)}\``).join(', ') : 'keine';
                lines.push(`- #${row.issue.number} ${safeText(row.issue.title)} · Claim: ${row.hasClaim ? '✅' : '⚠️ fehlt'} · Keys: ${keys} · PR: ${prs}`);
              }
            }

            lines.push('', '### Kollisionssignale');
            if (semanticCollisions.length === 0 && sameIssueCollisions.length === 0 && fileOverlaps.length === 0) {
              lines.push('- ✅ Keine semantischen Claim-, parallelen Closing-PR- oder exakten Dateikollisionen erkannt.');
            }
            for (const collision of semanticCollisions.slice(0, 40)) {
              lines.push(`- ⚠️ Coordination Key \`${safeCode(collision.key)}\` wird parallel von ${collision.owners.map((issue) => `#${issue.number}`).join(', ')} beansprucht. Vertrag/Split im Thread klären.`);
            }
            for (const collision of sameIssueCollisions.slice(0, 25)) {
              lines.push(`- ⚠️ Issue #${collision.issueNumber} wird gleichzeitig von ${collision.list.map((pr) => `#${pr.number}`).join(', ')} geschlossen. Split/Reihenfolge im Thread dokumentieren.`);
            }
            for (const overlap of fileOverlaps.slice(0, 40)) {
              const shown = overlap.shared.slice(0, 5).map((file) => `\`${safeCode(file)}\``).join(', ');
              const extra = overlap.shared.length > 5 ? ` +${overlap.shared.length - 5} weitere` : '';
              lines.push(`- ⚠️ PR #${overlap.left.number} ↔ #${overlap.right.number}: ${overlap.shared.length} gemeinsame Datei(en): ${shown}${extra}`);
            }

            lines.push('', '### Aufmerksamkeit / Handoffs');
            if (claimsWithoutPr.length === 0 && staleClaims.length === 0) {
              lines.push('- ✅ Keine verwaisten oder >72h stillen aktiven Claims erkannt.');
            } else {
              for (const issue of claimsWithoutPr.slice(0, 30)) {
                lines.push(`- ℹ️ #${issue.number}: aktiv, aber noch kein referenzierender offener PR sichtbar.`);
              }
              for (const issue of staleClaims.slice(0, 30)) {
                lines.push(`- 🕒 #${issue.number}: seit >72h keine sichtbare Issue-/verlinkte-PR-Aktivität; Claim prüfen oder Handoff dokumentieren.`);
              }
            }

            lines.push('', '### Externe Feature-Issues: Research Gate');
            if (missingResearch.length === 0) {
              lines.push('- ✅ Für erkannte offene externe Feature-Issues fehlt kein `external-research:v1`-Block.');
            } else {
              for (const issue of missingResearch.slice(0, 30)) {
                lines.push(`- 🔎 #${issue.number} ${safeText(issue.title)}: aktueller Konkurrenz-/Web-Research-Block fehlt.`);
              }
            }

            lines.push(
              '',
              '### Koordinationsregel',
              'Vor Code: **#223 + Ziel-Issue + offene `in progress`-Issues + offene PRs prüfen.** Claims nutzen enge Coordination Keys. Bei Material-Overlap erst per Kommentar Split/Vertrag/Reihenfolge klären. Externe Reporter müssen die Konkurrenzanalyse nicht selbst liefern.',
              '',
              '_Maschinelle Hinweise sind absichtlich konservativ. Fachliche Unabhängigkeit oder ein abgestimmter Overlap darf weiter parallel laufen._',
            );

            const body = lines.join('\n');
            const controlComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: controlIssue,
              per_page: 100,
            });
            const existing = controlComments.find((comment) => (comment.body || '').includes(dashboardMarker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: controlIssue,
                body,
              });
            }
