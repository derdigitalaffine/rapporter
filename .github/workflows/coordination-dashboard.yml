name: coordination-dashboard

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: coordination-dashboard
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: [self-hosted, linux]
    steps:
      - name: Update coordination dashboard in issue 223
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const controlIssue = 223;
            const dashboardMarker = '<!-- coordination-dashboard:v1 -->';
            const claimV2Marker = '<!-- coordination:claim:v2 -->';
            const claimV1Marker = '<!-- coordination:claim:v1 -->';
            const handoffV2Marker = '<!-- coordination:handoff:v2 -->';
            const researchMarker = '<!-- external-research:v1 -->';
            const internalAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const trustedMaintainerComment = (comment) => internalAssociations.has(comment.author_association || 'NONE');
            const isDashboardComment = (comment) => comment?.user?.login === 'github-actions[bot]'
              && String(comment.body || '').trimStart().startsWith(dashboardMarker);

            // Updating our own sticky emits issue_comment events. Ignore only
            // created/edited events from that bot comment; a deleted sticky must
            // still trigger this job so it can be recreated.
            const ownDashboardEvent = context.eventName === 'issue_comment'
              && context.payload.action !== 'deleted'
              && Number(context.payload.issue?.number) === controlIssue
              && isDashboardComment(context.payload.comment);
            if (ownDashboardEvent) {
              core.info('Ignoring self-generated dashboard comment event.');
              return;
            }

            // Public issue/PR metadata is untrusted input. Keep the privileged
            // #223 dashboard free from mentions and Markdown injection.
            const safeText = (value) => String(value ?? '')
              .replace(/[\r\n]+/g, ' ')
              .replace(/@/g, '@\u200b')
              .replace(/([\\`*_{}\[\]()<>#+.!|])/g, '\\$1');
            const safeCode = (value) => String(value ?? '')
              .replace(/[\r\n]+/g, ' ')
              .replace(/@/g, '@\u200b')
              .replace(/`/g, 'ˋ');
            const semanticDashboard = (value) => String(value || '')
              .split('\n')
              .map((line) => line.startsWith('Automatisch aktualisiert: ')
                ? 'Automatisch aktualisiert: <timestamp>'
                : line)
              .join('\n')
              .trim();

            const labelsOf = (issue) => (issue.labels || [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean)
              .map((label) => label.toLowerCase());

            const fieldValue = (body, fieldName) => {
              const escaped = fieldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(`^\\s*(?:-\\s*)?${escaped}\\s*:\\s*(.*)$`, 'i');
              for (const line of String(body || '').split('\n')) {
                const match = line.match(pattern);
                if (match) return match[1].trim();
              }
              return null;
            };

            const claimKind = (body) => {
              const text = String(body || '');
              if (text.includes(claimV2Marker)) return 'v2';
              if (text.includes(claimV1Marker)) return 'v1';
              if (/(?:^|\n)\s*(?:<!--\s*)?coordination:claim:v[12](?:\s*-->)?/i.test(text)) return 'bare';
              return null;
            };

            const claimBadge = (kind) => {
              if (kind === 'v2') return '✅ v2';
              if (kind === 'v1') return '🟡 v1';
              if (kind === 'bare') return '⚠️ malformed';
              return '❌ fehlt';
            };

            const normalizePhase = (body) => {
              const raw = String(fieldValue(body, 'Phase') || '').toLowerCase();
              return ['discovery', 'implementation', 'review', 'blocked'].includes(raw) ? raw : 'unknown';
            };

            const normalizeBranch = (body) => {
              let raw = fieldValue(body, 'Branch');
              if (!raw) {
                const combined = fieldValue(body, 'Branch/PR');
                if (combined) raw = combined.replace(/\s+\/\s+(?:#\d+|pending|none)\s*$/i, '');
              }
              raw = String(raw || '').trim().replace(/^`|`$/g, '');
              if (!raw || /^(none|pending|tbd|n\/a)$/i.test(raw)) return null;
              return raw;
            };

            const coordinationKeys = (body) => {
              const rawValue = fieldValue(body, 'Coordination keys');
              if (rawValue === null) return { keys: [], explicit: false, explicitNone: false };
              const raw = String(rawValue).trim();
              if (/^(none|n\/a)$/i.test(raw)) return { keys: [], explicit: true, explicitNone: true };
              const keys = [...new Set(raw.split(',')
                .map((key) => key.trim().replace(/^`|`$/g, ''))
                .filter((key) => /^[a-z0-9_-]+:[a-z0-9_./:-]+$/i.test(key))
                .map((key) => key.toLowerCase()))];
              return { keys, explicit: true, explicitNone: false };
            };

            // Relationships are machine contracts only when expressed as standalone
            // declarative lines. Narrative prose such as "does not close #205" must
            // never create a closing collision.
            const issueReferences = (body) => {
              const linked = new Set();
              const closing = new Set();
              for (const line of String(body || '').split('\n')) {
                const closingLine = line.match(/^\s*(?:[-*]\s*)?(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b\s*(.*)$/i);
                if (closingLine) {
                  for (const match of closingLine[1].matchAll(/#(\d+)/g)) {
                    const issueNumber = Number(match[1]);
                    closing.add(issueNumber);
                    linked.add(issueNumber);
                  }
                  continue;
                }
                const linkedLine = line.match(/^\s*(?:[-*]\s*)?(?:ref(?:s|erences?)?|part\s+of)\b\s*(.*)$/i);
                if (linkedLine) {
                  for (const match of linkedLine[1].matchAll(/#(\d+)/g)) {
                    linked.add(Number(match[1]));
                  }
                }
              }
              return { linked, closing };
            };

            // Parser contract checks: fail the workflow instead of silently
            // reintroducing high-noise coordination false positives.
            const parserChecks = [
              ['negated narrative is not closing', issueReferences('This PR intentionally does not close #205.').closing.size === 0],
              ['standalone closing line is closing', issueReferences('- Closes #205').closing.has(205)],
              ['refs line links without closing', issueReferences('Refs #205 #223').linked.has(205) && issueReferences('Refs #205 #223').closing.size === 0],
              ['exact v2 marker is canonical', claimKind(`${claimV2Marker}\n- Phase: discovery`) === 'v2'],
              ['bare claim stays visible as malformed', claimKind('coordination:claim:v1\nbranch: test') === 'bare'],
            ];
            for (const [name, ok] of parserChecks) {
              if (!ok) throw new Error(`Coordination parser contract failed: ${name}`);
            }

            const allIssueLike = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const issues = allIssueLike.filter((item) => !item.pull_request);
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const commentCache = new Map();
            const commentsFor = async (issueNumber) => {
              if (!commentCache.has(issueNumber)) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100,
                });
                commentCache.set(issueNumber, comments);
              }
              return commentCache.get(issueNumber);
            };

            const prData = [];
            for (const pr of pulls) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const refs = issueReferences(pr.body);
              prData.push({
                number: pr.number,
                title: pr.title,
                url: pr.html_url,
                updatedAt: pr.updated_at,
                linkedRefs: refs.linked,
                closingRefs: refs.closing,
                files: new Set(files.map((file) => file.filename)),
              });
            }

            const activeIssues = issues.filter((issue) => labelsOf(issue).includes('in progress'));
            const activeRows = [];
            const staleClaims = [];
            const claimsWithoutPr = [];
            const malformedClaims = [];
            const invalidV2Claims = [];
            const handoffCleanup = [];
            const now = Date.now();
            const staleAfterMs = 72 * 60 * 60 * 1000;
            const noPrGraceMs = 6 * 60 * 60 * 1000;

            for (const issue of activeIssues) {
              const comments = await commentsFor(issue.number);
              const claimComments = comments.filter((comment) => trustedMaintainerComment(comment) && claimKind(comment.body));
              const latestClaim = claimComments.at(-1);
              const kind = latestClaim ? claimKind(latestClaim.body) : null;
              const keyData = latestClaim ? coordinationKeys(latestClaim.body) : { keys: [], explicit: false, explicitNone: false };
              const phase = latestClaim ? normalizePhase(latestClaim.body) : 'unknown';
              const branch = latestClaim ? normalizeBranch(latestClaim.body) : null;
              const linkedPrs = prData.filter((pr) => pr.linkedRefs.has(issue.number));
              const latestVisibleActivity = Math.max(
                Date.parse(issue.updated_at || 0),
                ...linkedPrs.map((pr) => Date.parse(pr.updatedAt || 0)),
              );

              const handoffComments = comments.filter((comment) => trustedMaintainerComment(comment)
                && String(comment.body || '').includes(handoffV2Marker));
              const latestHandoff = handoffComments.at(-1);
              const disposition = latestHandoff
                ? String(fieldValue(latestHandoff.body, 'Disposition') || '').toLowerCase()
                : null;

              const row = {
                issue,
                latestClaim,
                claimKind: kind,
                keys: keyData.keys,
                keysExplicit: keyData.explicit,
                explicitNoKeys: keyData.explicitNone,
                phase,
                branch,
                linkedPrs,
                disposition,
              };
              activeRows.push(row);

              if (kind === 'bare') malformedClaims.push(issue);
              if (kind === 'v2') {
                const branchRequired = ['implementation', 'review'].includes(phase);
                const prRequired = phase === 'review';
                if (phase === 'unknown' || !keyData.explicit || (branchRequired && !branch) || (prRequired && linkedPrs.length === 0)) {
                  invalidV2Claims.push(issue);
                }
              }

              const claimAgeMs = latestClaim?.created_at ? now - Date.parse(latestClaim.created_at) : 0;
              if (latestClaim
                && linkedPrs.length === 0
                && ['implementation', 'review', 'unknown'].includes(phase)
                && claimAgeMs > noPrGraceMs) {
                claimsWithoutPr.push(issue);
              }
              if (now - latestVisibleActivity > staleAfterMs) staleClaims.push(issue);
              if (['superseded', 'paused', 'abandoned', 'completed'].includes(disposition)) handoffCleanup.push(issue);
            }

            const branchOwners = new Map();
            for (const row of activeRows) {
              if (!row.branch) continue;
              const key = row.branch.toLowerCase();
              if (!branchOwners.has(key)) branchOwners.set(key, { branch: row.branch, owners: [] });
              branchOwners.get(key).owners.push(row.issue);
            }
            const branchCollisions = [...branchOwners.values()]
              .filter(({ owners }) => owners.length > 1);

            const keyOwners = new Map();
            for (const row of activeRows) {
              for (const key of row.keys) {
                if (!keyOwners.has(key)) keyOwners.set(key, []);
                keyOwners.get(key).push(row.issue);
              }
            }
            const semanticCollisions = [...keyOwners.entries()]
              .filter(([, owners]) => owners.length > 1)
              .map(([key, owners]) => ({ key, owners }));

            const issueToClosingPrs = new Map();
            for (const pr of prData) {
              for (const issueNumber of pr.closingRefs) {
                if (!issueToClosingPrs.has(issueNumber)) issueToClosingPrs.set(issueNumber, []);
                issueToClosingPrs.get(issueNumber).push(pr);
              }
            }
            const sameIssueCollisions = [...issueToClosingPrs.entries()]
              .filter(([, list]) => list.length > 1)
              .map(([issueNumber, list]) => ({ issueNumber, list }));

            const fileOverlaps = [];
            for (let i = 0; i < prData.length; i += 1) {
              for (let j = i + 1; j < prData.length; j += 1) {
                const left = prData[i];
                const right = prData[j];
                const shared = [...left.files].filter((file) => right.files.has(file));
                if (shared.length > 0) fileOverlaps.push({ left, right, shared });
              }
            }

            const externalFeatureCandidates = issues.filter((issue) => {
              if (internalAssociations.has(issue.author_association || 'NONE')) return false;
              const labels = labelsOf(issue);
              return /^\[feature\]/i.test(issue.title || '')
                || labels.includes('enhancement')
                || labels.includes('feature')
                || labels.includes('feature request');
            });

            const missingResearch = [];
            for (const issue of externalFeatureCandidates) {
              const comments = await commentsFor(issue.number);
              if (!comments.some((comment) => trustedMaintainerComment(comment)
                && String(comment.body || '').includes(researchMarker))) {
                missingResearch.push(issue);
              }
            }

            const lines = [
              dashboardMarker,
              '## 🤝 Multi-Agent Coordination Dashboard',
              '',
              `Automatisch aktualisiert: ${new Date().toISOString()} · Steuerissue: #223 · Protokoll: \`AGENTS.md\``,
              '',
              '> Dieses Dashboard ist das gemeinsame Lagebild für Menschen und Agenten. Warnungen bedeuten: abstimmen oder Metadaten reparieren, nicht blind stoppen.',
              '',
              '### Aktive Arbeit (`in progress`)',
            ];

            if (activeRows.length === 0) {
              lines.push('- Keine offenen Issues mit `in progress`.');
            } else {
              for (const row of activeRows.slice(0, 50)) {
                const prs = row.linkedPrs.length
                  ? row.linkedPrs.map((pr) => `#${pr.number}`).join(', ')
                  : 'kein referenzierender offener PR';
                const keys = row.keys.length
                  ? row.keys.map((key) => `\`${safeCode(key)}\``).join(', ')
                  : row.explicitNoKeys ? '`none`' : 'nicht angegeben';
                const branch = row.branch ? `\`${safeCode(row.branch)}\`` : 'none';
                lines.push(`- #${row.issue.number} ${safeText(row.issue.title)} · Claim: ${claimBadge(row.claimKind)} · Phase: \`${safeCode(row.phase)}\` · Branch: ${branch} · Keys: ${keys} · PR: ${prs}`);
              }
            }

            lines.push('', '### Kollisionssignale');
            if (branchCollisions.length === 0 && semanticCollisions.length === 0 && sameIssueCollisions.length === 0 && fileOverlaps.length === 0) {
              lines.push('- ✅ Keine Branch-, semantischen Claim-, parallelen Closing-PR- oder exakten Dateikollisionen erkannt.');
            }
            for (const collision of branchCollisions.slice(0, 30)) {
              lines.push(`- 🛑 Branch \`${safeCode(collision.branch)}\` wird parallel von ${collision.owners.map((issue) => `#${issue.number}`).join(', ')} beansprucht. Einen kanonischen Delivery-Track wählen und Doppelclaim vor weiterer Implementierung auflösen.`);
            }
            for (const collision of semanticCollisions.slice(0, 40)) {
              lines.push(`- ⚠️ Coordination Key \`${safeCode(collision.key)}\` wird parallel von ${collision.owners.map((issue) => `#${issue.number}`).join(', ')} beansprucht. Vertrag/Split im Thread klären.`);
            }
            for (const collision of sameIssueCollisions.slice(0, 25)) {
              lines.push(`- ⚠️ Issue #${collision.issueNumber} wird durch deklarative Closing-Zeilen gleichzeitig von ${collision.list.map((pr) => `#${pr.number}`).join(', ')} geschlossen. Split/Reihenfolge prüfen.`);
            }
            for (const overlap of fileOverlaps.slice(0, 40)) {
              const shown = overlap.shared.slice(0, 5).map((file) => `\`${safeCode(file)}\``).join(', ');
              const extra = overlap.shared.length > 5 ? ` +${overlap.shared.length - 5} weitere` : '';
              lines.push(`- ⚠️ PR #${overlap.left.number} ↔ #${overlap.right.number}: ${overlap.shared.length} gemeinsame Datei(en): ${shown}${extra}`);
            }

            lines.push('', '### Aufmerksamkeit / Handoffs');
            if (malformedClaims.length === 0
                && invalidV2Claims.length === 0
                && claimsWithoutPr.length === 0
                && staleClaims.length === 0
                && handoffCleanup.length === 0) {
              lines.push('- ✅ Keine malformed Claims, ungültigen v2-Claims, überfälligen PR-Links, stillen Claims oder Handoff-Cleanup-Probleme erkannt.');
            } else {
              for (const issue of malformedClaims.slice(0, 30)) {
                lines.push(`- 🧹 #${issue.number}: Claim ist sichtbar, aber Marker ist malformed/bare. Beim nächsten Touch auf den exakten \`<!-- coordination:claim:v2 -->\`-Contract reparieren; keinen zweiten Claim anlegen.`);
              }
              for (const issue of invalidV2Claims.slice(0, 30)) {
                lines.push(`- 🧩 #${issue.number}: v2-Claim ist unvollständig (Phase/Branch/PR/Coordination-Keys gegen AGENTS.md prüfen).`);
              }
              for (const issue of claimsWithoutPr.slice(0, 30)) {
                lines.push(`- ℹ️ #${issue.number}: Implementation/Review seit >6h aktiv, aber noch kein referenzierender offener PR sichtbar. PR verlinken oder Phase/Status korrigieren.`);
              }
              for (const issue of staleClaims.slice(0, 30)) {
                lines.push(`- 🕒 #${issue.number}: seit >72h keine sichtbare Issue-/verlinkte-PR-Aktivität; Claim prüfen oder Handoff dokumentieren.`);
              }
              for (const issue of handoffCleanup.slice(0, 30)) {
                lines.push(`- 🧹 #${issue.number}: letzter v2-Handoff markiert Arbeit als nicht aktiv, Issue trägt aber weiter \`in progress\`. Label/Disposition bereinigen.`);
              }
            }

            lines.push('', '### Externe Feature-Issues: Research Gate');
            if (missingResearch.length === 0) {
              lines.push('- ✅ Für erkannte offene externe Feature-Issues fehlt kein `external-research:v1`-Block.');
            } else {
              for (const issue of missingResearch.slice(0, 30)) {
                lines.push(`- 🔎 #${issue.number} ${safeText(issue.title)}: aktueller Konkurrenz-/Web-Research-Block fehlt.`);
              }
            }

            lines.push(
              '',
              '### Koordinationsregel',
              'Vor Code: **#223 + Ziel-Issue + offene `in progress`-Issues + offene PRs prüfen.** Neue Arbeit nutzt den exakten `coordination:claim:v2`-Contract mit Phase, Branch und expliziten Coordination Keys. Gleicher Branch = sofort kanonischen Delivery-Track klären. Closing-Beziehungen nur als deklarative Standalone-Zeilen.',
              '',
              '_Maschinelle Hinweise sind absichtlich konservativ. Fachliche Unabhängigkeit oder ein abgestimmter Overlap darf weiter parallel laufen._',
            );

            const body = lines.join('\n');
            const controlComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: controlIssue,
              per_page: 100,
            });
            const existing = controlComments.find(isDashboardComment);

            if (existing && semanticDashboard(existing.body) === semanticDashboard(body)) {
              core.info('Coordination dashboard content is unchanged; skipping sticky comment update.');
              return;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: controlIssue,
                body,
              });
            }
