name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build

  e2e:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs-${{ github.run_attempt }}
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: famuhle
          POSTGRES_USER: famuhle
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U famuhle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: famuhle
      POSTGRES_USER: famuhle
      POSTGRES_PASSWORD: test-password
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py makemigrations family expenses --check --dry-run
      - working-directory: backend
        run: python manage.py migrate && python manage.py check
      - working-directory: backend
        run: python manage.py test

  containers:
    needs: [frontend, backend, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell setup tools
        run: bash -n scripts/setup.sh scripts/ensure-vapid.sh scripts/test-vapid-setup.sh scripts/tls-mode.sh scripts/export-caddy-ca.sh
      - name: Verify automatic VAPID provisioning
        run: bash scripts/test-vapid-setup.sh
      - name: Validate public Caddy config
        run: docker run --rm -e DOMAIN=familyos.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate internal TLS Caddy config
        run: docker run --rm -e DOMAIN=familyos.local -v "$PWD/Caddyfile.selfsigned:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate reverse-proxy Caddy config
        run: docker run --rm -e PUBLIC_HOST=familyos.example.com -e PUBLIC_SCHEME=https -v "$PWD/Caddyfile.proxy:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: cp .env.example .env
      - name: Validate default TLS compose config
        run: |
          docker compose config > /tmp/compose-tls.yml
          grep -q 'target: 443' /tmp/compose-tls.yml
      - name: Validate plain-HTTP reverse-proxy compose config
        env:
          COMPOSE_FILE: docker-compose.yml
          CADDYFILE: Caddyfile.proxy
          HTTP_BIND: 127.0.0.1
          HTTP_PORT: "8080"
          PUBLIC_SCHEME: https
          PUBLIC_HOST: familyos.example.com
        run: |
          docker compose config > /tmp/compose-proxy.yml
          grep -q 'published: "8080"' /tmp/compose-proxy.yml
          if grep -q 'target: 443' /tmp/compose-proxy.yml; then
            echo "proxy mode must not publish container port 443" >&2
            exit 1
          fi
      - run: docker compose build
