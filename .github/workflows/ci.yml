name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: famuhle
          POSTGRES_USER: famuhle
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U famuhle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: famuhle
      POSTGRES_USER: famuhle
      POSTGRES_PASSWORD: test-password
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py makemigrations family --check --dry-run || python manage.py makemigrations family
      - working-directory: backend
        run: python manage.py migrate && python manage.py check

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
