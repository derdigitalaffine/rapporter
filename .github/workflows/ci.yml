name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_DB: famuhle
          POSTGRES_USER: famuhle
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U famuhle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: famuhle
      POSTGRES_USER: famuhle
      POSTGRES_PASSWORD: test-password
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py makemigrations auth_abuse auth_identity auth_sessions entitlements telemetry family expenses baby pets documents contracts correspondence decisions wishlists mailing --check --dry-run
      - working-directory: backend
        run: python manage.py migrate && python manage.py check
      - working-directory: backend
        run: python manage.py test

  e2e_shard:
    name: e2e / ${{ matrix.project }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium, desktop-chromium]
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs-${{ matrix.project }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Keep the historical "e2e" check name stable for branch protection while
  # running all browser shards in parallel above.
  e2e:
    runs-on: ubuntu-latest
    if: always()
    needs: [e2e_shard]
    env:
      E2E_SHARD_RESULT: ${{ needs.e2e_shard.result }}
    steps:
      - name: Require all E2E shards
        run: test "$E2E_SHARD_RESULT" = "success"

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed official images from public mirrors
        run: |
          pull_official() {
            local spec="$1" source
            for source in \
              "public.ecr.aws/docker/library/${spec}" \
              "mirror.gcr.io/library/${spec}"; do
              if docker pull "$source"; then
                docker tag "$source" "$spec"
                return 0
              fi
            done
            echo "Could not pull official image ${spec} from any public mirror" >&2
            return 1
          }
          pull_official "python:3.13-slim"
          pull_official "node:22-alpine"
          pull_official "caddy:2-alpine"
      - name: Validate shell setup tools
        run: bash -n scripts/setup.sh scripts/ensure-vapid.sh scripts/test-vapid-setup.sh scripts/tls-mode.sh scripts/export-caddy-ca.sh scripts/configure-mail.sh scripts/configure-passkeys.sh scripts/test-passkey-config.sh
      - name: Verify automatic VAPID provisioning
        run: bash scripts/test-vapid-setup.sh
      - name: Verify Passkey env upgrade helper
        run: bash scripts/test-passkey-config.sh
      - name: Validate public Caddy config
        run: docker run --rm -e DOMAIN=familyos.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate internal TLS Caddy config
        run: docker run --rm -e DOMAIN=familyos.local -v "$PWD/Caddyfile.selfsigned:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile.selfsigned
      - name: Validate reverse-proxy Caddy config
        run: docker run --rm -e PUBLIC_HOST=familyos.example.com -e PUBLIC_SCHEME=https -v "$PWD/Caddyfile.proxy:/etc/caddy/Caddyfile.proxy:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile.proxy
      - run: cp .env.example .env
      - name: Validate default TLS compose config
        run: |
          docker compose config > /tmp/compose-tls.yml
          grep -q 'target: 443' /tmp/compose-tls.yml
      - name: Validate plain-HTTP reverse-proxy compose config
        env:
          COMPOSE_FILE: docker-compose.yml
          CADDYFILE: Caddyfile.proxy
          HTTP_BIND: 127.0.0.1
          HTTP_PORT: "8080"
          PUBLIC_SCHEME: https
          PUBLIC_HOST: familyos.example.com
        run: |
          docker compose config > /tmp/compose-proxy.yml
          grep -q 'published: "8080"' /tmp/compose-proxy.yml
          if grep -q 'target: 443' /tmp/compose-proxy.yml; then
            echo "proxy mode must not publish container port 443" >&2
            exit 1
          fi
      - run: docker compose build
      - name: Smoke-test Superadmin production routes
        env:
          CADDYFILE: Caddyfile.proxy
          HTTP_BIND: 127.0.0.1
          HTTP_PORT: "18080"
          PUBLIC_SCHEME: http
          PUBLIC_HOST: 127.0.0.1
        run: |
          cleanup() {
            docker compose down --remove-orphans >/dev/null 2>&1 || true
          }
          diagnose() {
            echo "--- caddy status ---" >&2
            docker compose ps -a >&2 || true
            echo "--- caddy logs ---" >&2
            docker compose logs --no-color caddy >&2 || true
          }
          fail() {
            echo "Superadmin static-route smoke failed: $1" >&2
            diagnose
            exit 1
          }
          assert_contains() {
            local url="$1" expected="$2" label="$3" body
            if ! body="$(curl -fsSL "$url")"; then
              fail "$label is not reachable"
            fi
            if ! grep -Fq "$expected" <<<"$body"; then
              echo "$body" | head -40 >&2
              fail "$label returned unexpected content"
            fi
          }

          trap cleanup EXIT
          docker compose up -d --no-deps caddy
          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              ready=1
              break
            fi
            if ! docker compose ps --status running --services | grep -qx caddy; then
              fail "caddy exited during startup"
            fi
            sleep 1
          done
          test "$ready" = "1" || fail "caddy did not become ready"

          bare_headers="$(curl -sS -D - -o /dev/null http://127.0.0.1:18080/superadmin | tr -d '\r')" || fail "/superadmin did not respond"
          bare_status="$(awk 'NR==1 {print $2}' <<<"$bare_headers")"
          bare_location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' <<<"$bare_headers")"
          echo "/superadmin status=$bare_status location=$bare_location"
          case "$bare_status" in
            301|302|307|308) ;;
            *) fail "/superadmin did not redirect to the canonical trailing-slash URL" ;;
          esac
          case "$bare_location" in
            /superadmin/|http://127.0.0.1:18080/superadmin/) ;;
            *) fail "/superadmin redirected to an unexpected location: $bare_location" ;;
          esac

          assert_contains http://127.0.0.1:18080/superadmin '<title>FamilyOS Superadmin</title>' "/superadmin redirect target"
          assert_contains http://127.0.0.1:18080/superadmin/ '<title>FamilyOS Superadmin</title>' "/superadmin/ shell"
          assert_contains http://127.0.0.1:18080/superadmin/security '<title>FamilyOS Superadmin</title>' "direct Superadmin subroute"
          assert_contains http://127.0.0.1:18080/superadmin/manifest.webmanifest '"start_url": "/superadmin/"' "Superadmin manifest"
          assert_contains http://127.0.0.1:18080/superadmin/sw.js "const SHELL='/superadmin/'" "Superadmin service worker"
