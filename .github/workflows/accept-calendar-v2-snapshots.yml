name: Accept calendar v2 visual references

on:
  push:
    branches:
      - feat/calendar-v2
    paths:
      - .github/workflows/accept-calendar-v2-snapshots.yml

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Update desktop calendar snapshots
        working-directory: frontend
        run: npx playwright test e2e/visual-regression.spec.js --project=desktop-chromium --update-snapshots=changed --grep 'visual · (Calendar|Event editor dialog)'
      - name: Update mobile calendar snapshots
        working-directory: frontend
        run: npx playwright test e2e/visual-regression.spec.js --project=mobile-chromium --update-snapshots=changed --grep 'visual · (Calendar|Event editor dialog)'
      - name: Commit visual references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/e2e/visual-regression.spec.js-snapshots/calendar-*-chromium-linux.png
          git add frontend/e2e/visual-regression.spec.js-snapshots/dialog-event-editor-*-chromium-linux.png
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git commit -m 'test(visual): accept calendar v2 references'
          git push origin HEAD:feat/calendar-v2
