name: ui-platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ui-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: node --test tests/navigation-contract.test.mjs tests/ui-boundaries.test.mjs tests/todo-workspace.test.mjs tests/today-overview.test.mjs tests/decision-context-panel-contract.test.mjs
      - run: npm run bundle:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- e2e/lazy-features.spec.js e2e/navigation.spec.js e2e/pwa-navigation.spec.js e2e/pwa-update.spec.js e2e/create-flow-registry.spec.js e2e/entitlements.spec.js e2e/statistics.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-platform-${{ github.run_attempt }}
          path: |
            frontend/bundle-report.json
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
