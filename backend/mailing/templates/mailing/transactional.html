<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title></head>
<body style="margin:0;background:#f7f8f3;color:#173c43;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f8f3;padding:24px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #e7ebe5;border-radius:18px;padding:28px">
        <tr><td style="font-size:14px;font-weight:800;padding-bottom:18px">FamilyOS</td></tr>
        <tr><td><h1 style="font-size:24px;line-height:1.2;margin:0 0 14px">{{ title }}</h1></td></tr>
        <tr><td style="font-size:16px;line-height:1.55">{{ body }}</td></tr>
        {% if details %}<tr><td style="font-size:14px;line-height:1.5;padding-top:14px">{{ details }}</td></tr>{% endif %}
        {% if action_url %}<tr><td style="padding-top:22px"><a href="{{ action_url }}" style="display:inline-block;background:#173c43;color:#ffffff;text-decoration:none;border-radius:12px;padding:12px 18px;font-weight:800">{% if action_label %}{{ action_label }}{% else %}FamilyOS öffnen{% endif %}</a></td></tr>{% endif %}
        {% if support_text %}<tr><td style="font-size:13px;color:#5f6f72;line-height:1.5;padding-top:22px">{{ support_text }}</td></tr>{% endif %}
      </table>
    </td></tr>
  </table>
</body>
</html>
