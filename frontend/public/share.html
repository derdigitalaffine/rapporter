<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c43"><title>Mit fam-uh-le teilen</title><style>body{font-family:system-ui;background:#f7f8f3;color:#173c43;display:grid;place-content:center;min-height:100vh;margin:0}.box{background:white;border-radius:20px;padding:24px;max-width:320px;text-align:center;box-shadow:0 8px 28px #1c3a3c12}img{width:72px}small{color:#6c7b7e}</style></head><body><div class="box"><img src="/brand/icon.svg" alt="fam-uh-le"><h2>fam-uh-le</h2><p id="status">Wird übernommen …</p><small>Geteilte Inhalte landen in der Familien-Inbox.</small></div><script>(async()=>{const p=new URLSearchParams(location.search),status=document.getElementById('status');async function token(){let access=localStorage.getItem('famuhle-access'),refresh=localStorage.getItem('famuhle-refresh');if(!access&&!refresh)return null;async function ok(t){const r=await fetch('/api/families/',{headers:{Authorization:'Bearer '+t}});return r.ok?r:null}if(access){const r=await ok(access);if(r)return [access,r]}if(refresh){const rr=await fetch('/api/auth/token/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh})});if(rr.ok){const d=await rr.json();access=d.access;localStorage.setItem('famuhle-access',access);const r=await ok(access);if(r)return [access,r]}}return null}try{const session=await token();if(!session){status.textContent='Bitte zuerst in fam-uh-le anmelden.';setTimeout(()=>location.replace('/'),1400);return}const [access,fr]=session,fd=await fr.json(),families=fd.results||fd;if(!families.length)throw 0;const title=p.get('title')||'Geteilt mit fam-uh-le',body=[p.get('text'),p.get('url')].filter(Boolean).join('\n');const r=await fetch('/api/inbox/',{method:'POST',headers:{Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({family:families[0].id,title,body,source:'share'})});if(!r.ok)throw 0;status.textContent='In der Familien-Inbox gespeichert ✓';setTimeout(()=>location.replace('/'),900)}catch{status.textContent='Konnte nicht übernommen werden.';setTimeout(()=>location.replace('/'),1400)}})();</script></body></html>
