<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c43"><meta name="referrer" content="no-referrer"><title>Mit FamilyOS teilen</title><style>body{font-family:system-ui;background:#f7f8f3;color:#173c43;display:grid;place-content:center;min-height:100vh;margin:0}.box{background:white;border-radius:20px;padding:24px;max-width:320px;text-align:center;box-shadow:0 8px 28px #1c3a3c12}img{width:72px}small{color:#6c7b7e}</style></head><body><div class="box"><img src="/brand/icon.svg" alt="FamilyOS"><h2>FamilyOS</h2><p id="status">Wird übernommen …</p><small>Geteilte Texte und Links landen weiterhin in der Familien-Inbox. Dateien öffnen den Dokument-Eingang.</small></div><script>(async()=>{const p=new URLSearchParams(location.search),status=document.getElementById('status');async function request(path,options={}){let response=await fetch(path,{...options,credentials:'include'});if(response.status===401){const refresh=await fetch('/api/auth/refresh/',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'}});if(refresh.ok)response=await fetch(path,{...options,credentials:'include'})}return response}try{const session=await request('/api/auth/session/');if(!session.ok){status.textContent='Bitte zuerst in FamilyOS anmelden.';setTimeout(()=>location.replace('/'),1400);return}const fr=await request('/api/families/');if(!fr.ok)throw 0;const payload=await fr.json(),families=payload.results||payload;if(!families.length)throw 0;const title=p.get('title')||'Geteilt mit FamilyOS',body=[p.get('text'),p.get('url')].filter(Boolean).join('\n');if(!body.trim()){status.textContent='Keine unterstützten Inhalte gefunden.';setTimeout(()=>location.replace('/'),1200);return}const r=await request('/api/inbox/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({family:families[0].id,title,body,source:'share'})});if(!r.ok)throw 0;status.textContent='In der Familien-Inbox gespeichert ✓';setTimeout(()=>location.replace('/'),900)}catch{status.textContent='Konnte nicht übernommen werden.';setTimeout(()=>location.replace('/'),1400)}})();</script></body></html>
