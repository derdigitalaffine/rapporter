<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c43"><title>Mit fam-uh-le teilen</title><style>body{font-family:system-ui;background:#f7f8f3;color:#173c43;display:grid;place-content:center;min-height:100vh;margin:0}.box{background:white;border-radius:20px;padding:24px;max-width:320px;text-align:center;box-shadow:0 8px 28px #1c3a3c12}img{width:72px}small{color:#6c7b7e}</style></head><body><div class="box"><img src="/logo.svg"><h2>fam-uh-le</h2><p id="status">Wird übernommen …</p><small>Geteilte Inhalte landen in der Familien-Inbox.</small></div><script>(async()=>{const p=new URLSearchParams(location.search), token=localStorage.getItem('famuhle-access'), status=document.getElementById('status'); if(!token){status.textContent='Bitte zuerst in fam-uh-le anmelden.';setTimeout(()=>location.replace('/'),1400);return}try{const h={'Authorization':'Bearer '+token,'Content-Type':'application/json'};const fr=await fetch('/api/families/',{headers:h});if(!fr.ok)throw 0;const fd=await fr.json(), families=fd.results||fd;if(!families.length)throw 0;const title=p.get('title')||'Geteilt mit fam-uh-le', body=[p.get('text'),p.get('url')].filter(Boolean).join('\n');const r=await fetch('/api/inbox/',{method:'POST',headers:h,body:JSON.stringify({family:families[0].id,title,body,source:'share'})});if(!r.ok)throw 0;status.textContent='In der Familien-Inbox gespeichert ✓';setTimeout(()=>location.replace('/'),900)}catch{status.textContent='Konnte nicht übernommen werden.';setTimeout(()=>location.replace('/'),1400)}})();</script></body></html>
