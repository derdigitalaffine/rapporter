services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-famuhle}
      POSTGRES_USER: ${POSTGRES_USER:-famuhle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-famuhle} -d ${POSTGRES_DB:-famuhle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      # In the standard topology every public request reaches Django through
      # exactly this pinned Caddy peer. This keeps X-Forwarded-For useful for
      # abuse keys without trusting an entire private Docker address range.
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-172.28.254.14/32}
    networks:
      - default
      - familyos_proxy
    volumes:
      - avatar_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      start_period: 60s
      start_interval: 3s
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      INTEGRATION_SYNC_SECONDS: ${INTEGRATION_SYNC_SECONDS:-300}
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do python manage.py sync_integrations || true; python manage.py process_pet_reminders || true; sleep $${INTEGRATION_SYNC_SECONDS}; done"]

  notification-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
    entrypoint: ["/bin/sh", "-c"]
    command: ["python manage.py flush_notifications --loop --interval 30"]

  mail-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
    entrypoint: ["/bin/sh", "-c"]
    command: ["python manage.py flush_transactional_email --loop --interval 10"]

  receipt-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
    entrypoint: ["/bin/sh", "-c"]
    command: ["python manage.py process_receipts --loop"]

  document-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
    volumes:
      - avatar_media:/app/media
    entrypoint: ["/bin/sh", "-c"]
    command: ["python manage.py process_documents --loop"]

  caddy:
    build:
      context: .
      dockerfile: docker/Caddy.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    networks:
      familyos_proxy:
        # Keep the trusted proxy peer outside Docker's dynamic allocation range
        # so another container can never be handed the same address first.
        ipv4_address: ${FAMILYOS_CADDY_IP:-172.28.254.14}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./${CADDYFILE:-Caddyfile.selfsigned}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  familyos_proxy:
    ipam:
      config:
        - subnet: ${FAMILYOS_PROXY_SUBNET:-172.28.254.0/28}
          # Dynamic peers (currently backend) are allocated only from the lower
          # half. Caddy uses a pinned address in the upper half.
          ip_range: ${FAMILYOS_PROXY_DYNAMIC_RANGE:-172.28.254.0/29}

volumes:
  postgres_data:
  avatar_media:
  caddy_data:
  caddy_config:
